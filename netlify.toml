[build]
  command = "npm ci --prefix apps/web && npm run web:build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/cases"
  to = "/.netlify/functions/cases"
  status = 200
  force = true

[[redirects]]
  from = "/api/demo-store"
  to = "/.netlify/functions/demo-store"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
